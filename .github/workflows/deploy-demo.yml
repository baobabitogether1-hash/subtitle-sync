name: Publish Web Demo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build & Release Android APK"]
    types:
      - completed
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  publish-web-demo:
    name: Publish Web Demo & Subtitle Artifacts to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Web Dependencies
        timeout-minutes: 3
        run: npm install

      - name: Build Web Application
        timeout-minutes: 5
        run: |
          echo "⚙️ Compiling latest web application..."
          npm run build

      - name: Stage E2E Reports into Web Distribution
        run: |
          # Fetch and preserve reports from gh-pages branch if available
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            echo "Preserving existing E2E reports from gh-pages branch..."
            git checkout gh-pages -- mochawesome.html 2>/dev/null || true
            git checkout gh-pages -- playwright 2>/dev/null || true
            git checkout gh-pages -- android-emulator-report.html 2>/dev/null || true
            git checkout gh-pages -- screenshots 2>/dev/null || true

            [ -f mochawesome.html ] && cp mochawesome.html dist/mochawesome.html && echo "Preserved mochawesome.html"
            [ -d playwright ] && cp -r playwright dist/ && echo "Preserved playwright report"
            [ -f android-emulator-report.html ] && cp android-emulator-report.html dist/android-emulator-report.html && echo "Preserved android-emulator-report.html"
            [ -d screenshots ] && cp -r screenshots dist/ && echo "Preserved screenshots directory"
          fi
          # Also stage any locally generated test reports
          if [ -d "cypress/reports" ]; then
            cp -r cypress/reports/* dist/ 2>/dev/null || true
            echo "Staged local cypress/reports to dist/"
          fi
          if [ -d "gh-pages-staging" ]; then
            cp -r gh-pages-staging/* dist/ 2>/dev/null || true
            echo "Staged local gh-pages-staging to dist/"
          fi

      - name: Deploy Web Demo to GitHub Pages (gh-pages branch)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))) && !cancelled()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true

      - name: Setup GitHub Pages (Native Actions Mode)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))) && !cancelled()
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact (Native Actions Mode)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))) && !cancelled()
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Native Actions Mode)
        id: deployment
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))) && !cancelled()
        uses: actions/deploy-pages@v4
        continue-on-error: true
