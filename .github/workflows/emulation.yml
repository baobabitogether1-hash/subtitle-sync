name: Android Emulator E2E Tests

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: ["Build & Release Android APK"]
    types:
      - completed
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: emulator-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  android-emulator-e2e:
    name: Android Emulator E2E Tests (Option C)
    runs-on: macos-14
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download APK Artifact from Release Workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: youtube-viewer-apks
          path: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Stage Pre-Built Android APK from Release Workflow
        id: stage_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android-shell/app/build/outputs/apk/debug
          if [ ! -f "release-artifacts/YouTube-Viewer-debug.apk" ] && command -v gh >/dev/null 2>&1; then
            echo "Attempting to retrieve latest build artifact from release-apk workflow via GitHub CLI..."
            gh run download -R "${{ github.repository }}" -n youtube-viewer-apks -D release-artifacts || true
          fi

          if [ -f "release-artifacts/YouTube-Viewer-debug.apk" ]; then
            echo "✅ Successfully staged pre-built Android APK from release-apk workflow. Skipping duplicate compilation."
            cp release-artifacts/YouTube-Viewer-debug.apk android-shell/app/build/outputs/apk/debug/app-debug.apk
            echo "have_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Pre-built APK not found from upstream workflow. Will compile from source."
            echo "have_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Web Build Artifact (Fallback for source build)
        if: steps.stage_apk.outputs.have_apk != 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize package registry URLs (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Web Dependencies (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: npm install

      - name: Build Web Application (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: |
          if [ ! -f "dist/index.html" ]; then
            npm run build
          fi

      - name: Bundle Web Assets into Android Native Shell (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Bundled web assets:"
          ls -la android-shell/app/src/main/assets/

      - name: Set up Java 17 (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell

      - name: Build Android Debug APK (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: |
          chmod +x android-shell/gradlew
          if [ ! -f "android-shell/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing; downloading wrapper jar..."
            mkdir -p android-shell/gradle/wrapper
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o android-shell/gradle/wrapper/gradle-wrapper.jar
          fi
          cd android-shell
          ./gradlew assembleDebug --stacktrace

      - name: Run E2E Test on Android Emulator (Option C)
        id: android_e2e
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r android-shell/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.ytviewer.app
            adb shell am start -a android.intent.action.VIEW -n com.ytviewer.app/.MainActivity -d "https://www.youtube.com/watch?v=n9qwEOsqsoo"
            adb shell screencap -p /sdcard/screen.png; adb pull /sdcard/screen.png ./android-emulator-screenshot.png || true
            bash scripts/android-e2e-assert.sh
            adb shell screencap -p /sdcard/screen.png; adb pull /sdcard/screen.png ./android-emulator-screenshot.png

      - name: Publish Android E2E Result to Job Summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.android_e2e.outcome }}
        run: |
          {
            echo "## Android Emulator E2E Result"
            echo ""
            echo "**Result:** \`${E2E_OUTCOME}\`"
            if [ "$E2E_OUTCOME" = "success" ]; then
              echo ""
              echo "The real Android app fetched non-empty default captions, then non-empty Hebrew and Italian favorite captions. The emulator assertion verified the response order."
              if [ -f android-emulator-logcat.txt ]; then
                echo ""
                echo '```text'
                grep "SUBTITLE_FETCH" android-emulator-logcat.txt | tail -n 20 || true
                echo '```'
              fi
            else
              echo ""
              echo "The emulator test did not pass. Relevant captured logcat:"
              if [ -f android-emulator-logcat.txt ]; then
                echo '```text'
                grep -E "APP_READY|APP_BOOT_ERROR|FATAL EXCEPTION|WebView error|Asset not found|SUBTITLE_FETCH" android-emulator-logcat.txt | tail -n 60 || echo "No matching diagnostic lines found."
                echo '```'
              else
                echo "Logcat was not produced."
              fi
            fi
            echo ""
            echo "The screenshot and full logcat are available in the \`android-emulator-artifacts\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android Emulator Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-artifacts
          path: |
            android-emulator-screenshot.png
            android-emulator-logcat.txt
            android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Android Emulator Artifacts for GitHub Pages
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.android_e2e.outcome }}
        run: |
          mkdir -p gh-pages-staging/screenshots
          if [ -f "./android-emulator-screenshot.png" ]; then
            cp ./android-emulator-screenshot.png gh-pages-staging/screenshots/android-emulator-screenshot.png
            echo "Staged android-emulator-screenshot.png to gh-pages-staging/screenshots/"
          fi
          if [ -f "./android-emulator-logcat.txt" ]; then
            cp ./android-emulator-logcat.txt gh-pages-staging/screenshots/android-emulator-logcat.txt
            echo "Staged android-emulator-logcat.txt to gh-pages-staging/screenshots/"
          fi
          STATUS_CLASS="status-success"
          if [ "$E2E_OUTCOME" != "success" ]; then
            STATUS_CLASS="status-failure"
          fi
          RECENT_LOGS=""
          if [ -f "./android-emulator-logcat.txt" ]; then
            RECENT_LOGS=$(grep "SUBTITLE_FETCH" ./android-emulator-logcat.txt | tail -n 25 || true)
          fi
          node -e '
            const fs = require("fs");
            const outcome = process.env.E2E_OUTCOME || "unknown";
            const statusClass = outcome === "success" ? "status-success" : "status-failure";
            let recentLogs = "";
            if (fs.existsSync("./android-emulator-logcat.txt")) {
              const lines = fs.readFileSync("./android-emulator-logcat.txt", "utf8").split("\n");
              recentLogs = lines.filter(l => l.includes("SUBTITLE_FETCH")).slice(-25).join("\n");
            }
            const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Android Emulator E2E Test Report</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f3f4f6; padding: 2rem; max-width: 1000px; margin: 0 auto; line-height: 1.5; }
              h1 { color: #38bdf8; margin-bottom: 0.5rem; }
              .status { display: inline-block; padding: 0.35rem 0.85rem; border-radius: 9999px; font-weight: bold; margin-bottom: 1rem; }
              .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
              .status-failure { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
              .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
              pre { background: #030712; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #a5f3fc; font-size: 0.875rem; max-height: 400px; }
              img { max-width: 100%; max-height: 600px; border-radius: 8px; border: 1px solid #374151; display: block; margin-top: 1rem; }
              a { color: #38bdf8; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Android Emulator E2E Test Report</h1>
            <p>Authentic runtime execution and WebView interception test report on Android 14 (API 34) Google APIs emulator.</p>
            <div class="card">
              <h2>Execution Outcome</h2>
              <span class="status ${statusClass}">Outcome: ${outcome}</span>
              <p>Target test package: <code>com.ytviewer.app</code> running native timedtext interception and TTS hardware coordination.</p>
            </div>
            <div class="card">
              <h2>Captured Emulator Screenshot</h2>
              <p><a href="./screenshots/android-emulator-screenshot.png" target="_blank">Open Full Resolution Screenshot</a></p>
              <img src="./screenshots/android-emulator-screenshot.png" alt="Android Emulator Screenshot" onerror="this.style.display=\x27none\x27" />
            </div>
            <div class="card">
              <h2>Logcat Telemetry (Recent Subtitle Fetches)</h2>
              <pre>${recentLogs}</pre>
              <p style="margin-top: 0.5rem;"><a href="./screenshots/android-emulator-logcat.txt" target="_blank">Download Full Logcat File</a></p>
            </div>
          </body>
          </html>`;
            fs.writeFileSync("gh-pages-staging/android-emulator-report.html", html);
          '
          echo "Generated gh-pages-staging/android-emulator-report.html"

      - name: Deploy Android Emulator Artifacts to GitHub Pages (gh-pages branch)
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))) && !cancelled()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-staging
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true
